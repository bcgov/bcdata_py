name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main]
    paths:
      - '.github/workflows/tests.yml'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'src/bcdata/**'
      - 'tests/**'
      - 'scripts/replicate.py'
      - 'data/replication.toml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/tests.yml'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'src/bcdata/**'
      - 'tests/**'
      - 'scripts/replicate.py'
      - 'data/replication.toml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with ruff
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      # ruff version pinned here should match the rev in .pre-commit-config.yaml
      - name: Check lint rules
        run: uvx ruff@0.16.3 check .
      - name: Check formatting
        run: uvx ruff@0.16.3 format --check .

  test:
    runs-on: ubuntu-latest
    name: test
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags to derive the version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'

      # the replicate group (fit_changedetector, obstore) is needed by
      # tests/test_replicate.py, which is skipped without it
      - name: Install dependencies
        run: uv sync --extra test --group replicate

      # record the runner's IP, to check whether refused connections follow runner IPs
      # (#264). Same lookup as bcgov/actions-openshift's runner reachability probe
      - name: Runner IP
        run: |
          echo "runner IP: $(curl -sS --max-time 20 https://api.ipify.org 2>/dev/null || echo unknown)"

      # no -x: a refused connection in one test should not hide the other results.
      # No pytest reruns: bcdata itself retries failed requests for several minutes
      # (RETRY_POLICY). The time limit stops a runner that is blocked for the whole
      # job from waiting through every test's retries.
      # log_cli shows warnings (eg each retried request and its cause) as they happen,
      # even for tests that pass; --durations lists where the time went (#264)
      - name: Run tests
        timeout-minutes: 45
        run: >-
          uv run pytest -v -rxXs --durations=10
          -o log_cli=true -o log_cli_level=WARNING
          -o log_cli_format="%(asctime)s %(levelname)s %(name)s: %(message)s"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
