name: Tests

on:
  push:
    branches: [ main]
    paths:
      - '.github/workflows/tests.yaml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'src/bcdata/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'src/bcdata/**'
      - 'tests/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with ruff
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      # ruff version pinned here should match the rev in .pre-commit-config.yaml
      - name: Check lint rules
        run: uvx ruff@0.16.3 check .
      - name: Check formatting
        run: uvx ruff@0.16.3 format --check .

  docker_tests:
    runs-on: ubuntu-latest
    name: Docker | GDAL=${{ matrix.gdal-version }} | python=${{ matrix.python-version }}
    container: ghcr.io/osgeo/gdal:ubuntu-small-${{ matrix.gdal-version }}
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            gdal-version: '3.5.3'
          - python-version: '3.10'
            gdal-version: '3.6.4'
          - python-version: '3.11'
            gdal-version: '3.7.3'
          - python-version: '3.12'
            gdal-version: '3.9.3'
          - python-version: '3.12'
            gdal-version: '3.10.0'
          - python-version: '3.13'
            gdal-version: '3.10.0'

    steps:
      - uses: actions/checkout@v4

      - name: Update and install postgresql client
        run: |
          apt-get update
          apt-get -y install software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          apt-get install -y --no-install-recommends \
            python${{ matrix.python-version }} \
            python${{ matrix.python-version }}-dev \
            python${{ matrix.python-version }}-venv \
            python3-pip \
            g++

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra test --python python${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -v -rxXs
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
