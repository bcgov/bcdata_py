name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main]
    paths:
      - '.github/workflows/tests.yml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'src/bcdata/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/tests.yml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - 'src/bcdata/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint with ruff
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      # ruff version pinned here should match the rev in .pre-commit-config.yaml
      - name: Check lint rules
        run: uvx ruff@0.16.3 check .
      - name: Check formatting
        run: uvx ruff@0.16.3 format --check .

  test:
    runs-on: ubuntu-latest
    name: test
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags to derive the version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -v -rxXs -x
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
