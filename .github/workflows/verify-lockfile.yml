# Fails when .github/workflows/actions.lock is out of sync with the workflows, or a
# locked pin no longer verifies upstream. Regenerate it with `gh actions-lock`.
# From https://github.com/github/gh-actions-lock/blob/main/.github/workflows/verify-lockfile.yml

name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # keep in step with the gh-actions-lock version used to generate actions.lock
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
      - run: gh actions-lock --verify
