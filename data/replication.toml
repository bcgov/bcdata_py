["whse_forest_tenure.ften_road_section_lines_svw"]
schedule = "monthly"
# a road section within a forest tenure file - a natural composite key, hashed
# without geometry so that geometry edits are reported as modifications.
# forest_file_id + road_section_id alone is not unique: on 2026-11-24, 558 sections
# each had an ACTIVE and a PENDING record, so life_cycle_status_code is included
# (unique across all 287,122 records). A section going from PENDING to ACTIVE is
# then reported as deleted + new. Stability is unchecked
hash_columns = ["forest_file_id", "road_section_id", "life_cycle_status_code"]

