[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bcdata"
dynamic = ["version"]
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name="Simon Norris", email="snorris@hillcrestgeo.ca"},
]
description = "Download open data, monitor and report on changes"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent"
]
dependencies = [
    "click",
    "geoalchemy2",
    "geopandas",
    "owslib",
    "psycopg2-binary",
    "requests",
    "sqlalchemy",
    "stamina"
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-rerunfailures",
  "pre-commit",
  "requests-mock"
]

[project.scripts]
bcdata = "bcdata.cli:cli"

[project.urls]
Homepage = "https://github.com/smnorris/bcdata"
Issues = "https://github.com/smnorris/bcdata"

[tool.setuptools_scm]
write_to = "src/bcdata/_version.py"

[tool.ruff]
line-length = 100