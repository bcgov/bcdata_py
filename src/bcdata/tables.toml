# Metadata about BC Geographic Warehouse tables available via bcdata,
# bundled with the package (see https://github.com/bcgov/bcdata_py/issues/259).
#
# Each entry is a table name in quotes and brackets, followed by its fields:
#
#   ["whse_fish.pscis_assessment_svw"]
#   primary_key = "stream_crossing_id"
#
# Everything in this file is lowercase: table names (bcdata.list_tables() returns the
# same names in uppercase) and all field values. Every field is optional - add a
# table only when there is something to record. Fields:
#
#   primary_key       column that is unique, never empty, and stable across source
#                     refreshes - safe to use as a record identifier (bc2pg primary key,
#                     joins, change detection). Also used to sort paged requests.
#   sort_key          column that is unique and never empty within one download, but
#                     not stable across refreshes - used only to sort paged requests,
#                     never as an identifier. Takes precedence over primary_key for
#                     sorting; must not be the same column as primary_key.
#   bcdc_object_name  object name the BC Data Catalogue uses for the table, when it
#                     differs from the table name
#
# After editing, validate against the live services:  python scripts/validate_tables.py

